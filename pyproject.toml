[project]
name = "api-router"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bambanourathmaimouna", email = "bambanourathmaimouna@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standart]>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
api-router = "api_router:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
